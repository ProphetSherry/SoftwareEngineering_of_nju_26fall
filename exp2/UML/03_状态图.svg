djust="spacingAndGlyphs" textLength="42" x="280.57" y="774.0118">已取消</text><rect fill="#FEFECE" height="50" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="62" x="530.57" y="752.7719"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="530.57" x2="592.57" y1="783.0438" y2="783.0438"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="42" x="540.57" y="774.0118">已签到</text><rect fill="#FEFECE" height="50" rx="12.5" ry="12.5" style="stroke: #A80036; stroke-width: 1.5;" width="50" x="1244.57" y="752.7719"/><line style="stroke: #A80036; stroke-width: 1.5;" x1="1244.57" x2="1294.57" y1="783.0438" y2="783.0438"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="28" x="1255.57" y="774.0118">缺席</text><polygon fill="#FEFECE" points="686.57,130.2719,698.57,142.2719,686.57,154.2719,674.57,142.2719,686.57,130.2719" style="stroke: #A80036; stroke-width: 1.5;"/><ellipse cx="686.57" cy="38.2719" fill="#000000" rx="10" ry="10" style="stroke: none; stroke-width: 1.0;"/><path d="M628.07,746.2719 L628.07,773.7719 L592.93,777.7719 L628.07,781.7719 L628.07,809.0876 A4,4 0 0 0 632.07,813.0876 L925.07,813.0876 A4,4 0 0 0 929.07,809.0876 L929.07,752.2719 L919.07,742.2719 L632.07,742.2719 A4,4 0 0 0 628.07,746.2719 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M919.07,742.2719 L919.07,750.2719 A2,2 0 0 0 921.07,752.2719 L929.07,752.2719 L919.07,742.2719 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="196" x="634.07" y="763.5118">不因对象取消改变已签到状态。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="280" x="634.07" y="783.7838">未结束场次取消通过，实际收款者仍待退款。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="266" x="634.07" y="804.0557">重复验票返回失败，不保存失败业务日志。</text><path d="M158.07,888.2719 L158.07,951.0876 A4,4 0 0 0 162.07,955.0876 L441.07,955.0876 A4,4 0 0 0 445.07,951.0876 L445.07,894.2719 L435.07,884.2719 L305.57,884.2719 L301.57,802.8419 L297.57,884.2719 L162.07,884.2719 A4,4 0 0 0 158.07,888.2719 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M435.07,884.2719 L435.07,892.2719 A2,2 0 0 0 437.07,894.2719 L445.07,894.2719 L435.07,884.2719 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="266" x="164.07" y="905.5118">已取消、已签到、缺席均无报名状态出边。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="252" x="164.07" y="925.7838">已结束场次历史不受后续活动取消影响。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="210" x="164.07" y="946.0557">退款独立进行，不改变报名状态。</text><path d="M964.07,736.2719 L964.07,819.3596 A4,4 0 0 0 968.07,823.3596 L1205.07,823.3596 A4,4 0 0 0 1209.07,819.3596 L1209.07,781.7719 L1244.56,777.7719 L1209.07,773.7719 L1209.07,742.2719 L1199.07,732.2719 L968.07,732.2719 A4,4 0 0 0 964.07,736.2719 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><path d="M1199.07,732.2719 L1199.07,740.2719 A2,2 0 0 0 1201.07,742.2719 L1209.07,742.2719 L1199.07,732.2719 " fill="#FBFB77" style="stroke: #A80036; stroke-width: 1.0;"/><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="154" x="970.07" y="753.5118">取消待审跨过场次结束：</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="224" x="970.07" y="773.7838">该场次取消申请失效；仍处理缺席。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="210" x="970.07" y="794.0557">特殊暂停验票退款认定尚未实现，</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="14" lengthAdjust="spacingAndGlyphs" textLength="182" x="970.07" y="814.3276">不能视为已有自动退款分支。</text><!--MD5=[66574ef285583b050474074f1cbc6889]
